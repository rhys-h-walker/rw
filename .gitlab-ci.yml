stages:
  - test
  - build
  - publish

test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  variables:
    DOTNET_NOLOGO: "1"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget"
  cache:
    key: "nuget-$CI_COMMIT_REF_SLUG"
    paths:
      - .nuget/
  script:
    - dotnet restore rw.slnx
    - dotnet build rw.slnx -c Release --no-restore
    - dotnet test rw.slnx -c Release --no-build --logger trx --results-directory TestResults
  artifacts:
    when: always
    paths:
      - TestResults/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG

# Start from New pipeline with the variable RELEASE_VERSION, for example 0.2.0 or v0.2.0-beta1. The branch you
# choose is the one that gets tagged, so pick master for a real release.
build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  variables:
    DOTNET_NOLOGO: "1"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DEBIAN_FRONTEND: "noninteractive"
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget"
  cache:
    key: "nuget-$CI_COMMIT_REF_SLUG"
    paths:
      - .nuget/
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq msitools
  script:
    - bash installer/build-release.sh "$RELEASE_VERSION"
  artifacts:
    paths:
      - dist/
    expire_in: 30 days
  rules:
    - if: $RELEASE_VERSION

publish:
  stage: publish
  image: mcr.microsoft.com/dotnet/sdk:10.0
  variables:
    DEBIAN_FRONTEND: "noninteractive"
  needs:
    - build
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl jq
  script:
    - bash installer/publish-gitlab-release.sh "$RELEASE_VERSION"
  rules:
    - if: $RELEASE_VERSION