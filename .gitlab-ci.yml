stages:
  - test

test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  variables:
    DOTNET_NOLOGO: "1"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget"
  cache:
    key: "nuget-$CI_COMMIT_REF_SLUG"
    paths:
      - .nuget/
  script:
    - dotnet restore rw.slnx
    - dotnet build rw.slnx -c Release --no-restore
    - dotnet test rw.slnx -c Release --no-build --logger trx --results-directory TestResults
  artifacts:
    when: always
    paths:
      - TestResults/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG